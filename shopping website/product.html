<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Details</title>
    <link rel="stylesheet" href="css/style.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
  <a href="index.html" class="logo">UrbanCart</a>

  <nav>
    <a href="index.html">Home</a>
    <a href="shop.html">Shop</a>
    <a href="shop.html">Categories</a>
    <a href="shop.html">Offers</a>
    <a href="about.html">About</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="header-icons">
    <input type="search" placeholder="Search products...">
    <a href="account.html">Account</a>
    <a href="wishlist.html">Wishlist</a>
    <a href="cart.html">Cart <span id="cart-count">0</span></a>
  </div>
</header>
  <main>
  <div class="product-page container" id="product-page">

    <div class="gallery">
      <img id="main-image" src="" alt="" class="main-image">
      <div class="thumbnails" id="thumbnails"></div>
    </div>

    <div class="product-info">
      <h1 id="p-name"></h1>
      <p class="card-rating" id="p-rating"></p>
      <p class="card-price" id="p-price"></p>
      <p class="stock" id="p-stock"></p>
      <p id="p-desc"></p>

      <h3>Specifications</h3>
      <ul id="p-specs"></ul>

      <div class="qty-selector">
        <button id="qty-minus">-</button>
        <span id="qty-value">1</span>
        <button id="qty-plus">+</button>
      </div>

      <div class="product-actions">
        <button class="btn" id="add-to-cart-btn">Add to Cart</button>
        <button class="btn" id="buy-now-btn">Buy Now</button>
        <button class="wishlist-btn" id="wishlist-toggle-btn">♡</button>
      </div>
    </div>

  </div>

  <div class="zoom-overlay" id="zoom-overlay">
    <span class="zoom-close" id="zoom-close">&times;</span>
    <img id="zoom-image" src="" alt="">
  </div>
</main>

  <footer>
    <p>&copy; 2026 UrbanCart. All rights reserved.</p>
    <p>Email: support@urbancart.com | Phone: +91 98765 43210</p>
    <div class="social">
      <a href="#">Facebook</a>
      <a href="#">Instagram</a>
      <a href="#">Twitter</a>
    </div>
  </footer>




 <script src="js/products.js" defer></script>
  <script src="js/product-details.js" defer></script>
<script src="js/cart.js" defer></script>
<script src="js/wishlist.js" defer></script>
  <script src="js/script.js" defer></script>
</body>
</html>
